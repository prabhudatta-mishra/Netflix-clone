server.port=8080
spring.application.name=netflix-backend

# ========== MySQL (auto-creates database + tables on startup) ==========
# 1. Start MySQL Server (port 3306)
# 2. Run NetflixBackendApplication in STS — no manual SQL needed
spring.datasource.url=jdbc:mysql://localhost:3306/netflix_clone?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=55555
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=netflixCloneJwtSuperSecretKeyForHS256AlgorithmThatIsAtLeast256Bits
jwt.expiration=86400000

# ========== Email verification ==========
# To send real verification email, set these values with your SMTP account.
# Gmail example: create an App Password, then set spring.mail.username/password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${spring.mail.username:no-reply@netflix-clone.local}
app.frontend.url=http://localhost:3000

app.upload.dir=uploads
# Copy downloaded movies here (no browser upload). Then Admin -> Import from folder.
app.offline.import-dir=offline-import
# On backend start: auto import offline-import + link videos (Netflix-style)
app.netflix.auto-sync-on-startup=true
spring.servlet.multipart.enabled=true
# Browser upload limit. For very large movies, prefer copying files to offline-import
# and using Admin -> Import from folder instead of uploading through the browser.
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
spring.servlet.multipart.file-size-threshold=2MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=10GB
